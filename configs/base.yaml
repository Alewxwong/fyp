seed: 42
output_dir: outputs
data:
  root: "C:/Users/user/Desktop/ufno/RadioMapSeer"
  manifest: data/manifests/irt2.csv
  split_dir: data/splits
  image_size: 256
  input_mode: five
  tx_sigma: 2.0
  num_workers: 4
  pin_memory: true
  augment: true
  # Used to convert PNG [0,255] to dB: dB = min_db + png/255*(max_db-min_db)
  min_db: -127.0
  max_db: -47.0
training:
  epochs: 100
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  patience: 15
  amp: true
  grad_clip: 1.0
  loss: l1
  gradient_weight: 0.0
  scheduler: cosine
  save_predictions: true
model:
  name: unet
  in_channels: 5
  out_channels: 1
  base_width: 32
  width: 48
  modes1: 20
  modes2: 20
  depth: 4
  padding: 9
